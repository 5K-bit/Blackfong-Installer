# OBEOS v1 shipping desktop: Kubuntu 24.04 LTS + KDE Plasma.
# XFCE/Xubuntu is migration input only and must not be installed by the shipping path.
packages:
  - kubuntu-desktop
  - plasma-workspace
  - sddm
  - network-manager
  - pipewire
  - wireplumber
  - gstreamer1.0-tools
  # Optional repo-provided Blackfong tooling may be added when available.
  - blackfong-code-warden-shell
