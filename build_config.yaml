# OBEOS installer media build configuration
# Shipping doctrine: Ubuntu 24.04 LTS (noble) + Kubuntu/KDE Plasma.

version: v0.9-rc

targets:
  - amd64

# Offline apt repo shipped on the media. The repository content must be built
# against the same Ubuntu suite as the target rootfs; mixing Debian Bookworm
# packages into an Ubuntu Noble target is not supported.
offline_repo:
  path: assets/apt-repo
  live_path: /opt/blackfong/apt-repo
  trusted: true
  suite: noble
  component: main

ubuntu:
  suite: noble
  mirror: http://archive.ubuntu.com/ubuntu

# Compatibility key retained while older build code is migrated. It must carry
# the same Ubuntu values; Debian/Bookworm is no longer a shipping configuration.
debian:
  suite: noble
  mirror: http://archive.ubuntu.com/ubuntu

arch:
  amd64:
    kernel_package: linux-generic
    extra_packages:
      - casper
      - grub-efi-amd64-bin
      - grub-efi-amd64-signed
      - shim-signed
      - efibootmgr
      - squashfs-tools
      - xorriso

outputs:
  amd64_iso: output/obeos-installer-amd64.iso

paths:
  work_dir: build/work
  logs_dir: logs
