# Blackfong installer media build configuration
# This file is read by the build pipeline (blackfong-build).

version: vNext-1.0

targets:
  - amd64
  - arm64
  - armhf

# Offline apt repo shipped on the media.
offline_repo:
  path: assets/apt-repo
  # The offline repo is mounted/copied into the live env at this path:
  live_path: /opt/blackfong/apt-repo
  trusted: true
  suite: bookworm
  component: main

# Debian bootstrap settings for the *live environment*
debian:
  suite: bookworm
  mirror: http://deb.debian.org/debian

# Packages the live (installer) environment needs to run the pipeline.
# The installer shells out to these, so a live image without them cannot install.
live_packages:
  - python3
  - python3-yaml
  - debootstrap
  - gdisk
  - parted
  - dosfstools
  - e2fsprogs
  - util-linux
  - dbus
  - ca-certificates
  - git

# O.B.E.O.S. components bundled onto the media (cloned at build time, installed
# into /opt/obeos/venv on the target at install time; needs internet for pip).
bundle:
  dest: /opt/blackfong/bundle
  repos:
    - {name: O.B.E.O.S, url: https://github.com/5K-bit/O.B.E.O.S.git, pip: blackfong_ecosystem}
    - {name: 3000, url: https://github.com/5K-bit/3000.git}
    - {name: Blackforge, url: https://github.com/5K-bit/Blackforge.git}
    - {name: Earthglass, url: https://github.com/5K-bit/Earthglass.git}
    - {name: Max-Payne, url: https://github.com/5K-bit/Max-Payne.git}
    - {name: Night-watch-OS, url: https://github.com/5K-bit/Night-watch-OS.git}
    - {name: QuietDrop, url: https://github.com/5K-bit/QuietDrop.git}
    - {name: The-Assistant, url: https://github.com/5K-bit/The-Assistant.git, pip: null}
    - {name: Blackrelay, url: https://github.com/5K-bit/Blackrelay.git, pip: null}
    - {name: PYBUS, url: https://github.com/5K-bit/PYBUS.git, pip: null}

# Per-arch defaults for the live environment
arch:
  amd64:
    kernel_package: linux-image-amd64
    extra_packages:
      - live-boot
      - grub-efi-amd64-bin
      - efibootmgr
  arm64:
    kernel_package: linux-image-arm64
    extra_packages: []
  armhf:
    kernel_package: linux-image-armhf
    extra_packages: []

# Output artifact names
outputs:
  amd64_iso: output/blackfong-installer-amd64.iso
  arm64_img: output/blackfong-installer-arm64.img
  armhf_img: output/blackfong-installer-armhf.img

# Build working directories
paths:
  work_dir: build/work
  logs_dir: logs
